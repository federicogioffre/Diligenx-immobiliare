name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the production Docker image (python:3.12-slim).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      # conftest.py forces DATABASE_URL to SQLite, so no Postgres service is
      # needed; embeddings and LLM calls use the Fake providers.
      - name: Run test suite
        working-directory: apps/api
        run: python -m pytest ../../tests -q

  backend-postgres-integration:
    name: Backend Postgres integration (connection-pool regression)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diligenx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/diligenx_ci
      # A non-SQLite DATABASE_URL puts main.py's startup guard into
      # production mode, which then requires a strong SECRET_KEY too.
      # CI-only value, never used anywhere real.
      SECRET_KEY: ci-postgres-integration-secret-key-not-for-production-use
      AUTH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      # Runs the full migration chain (including the RLS-enabling migration)
      # against a REAL Postgres, then a small, focused suite that — unlike
      # tests/ (SQLite, get_db() overridden) — exercises the app's actual
      # connection-pool lifecycle. This is the job that would have caught
      # the incident where the RLS checkin handler left a transaction open,
      # 500-ing every reused connection in production.
      - name: Run Alembic migrations against Postgres
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run Postgres integration suite
        working-directory: apps/api
        run: python -m pytest ../../tests_integration -q

  web-build:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `next build` runs the TypeScript compiler, so this doubles as the
      # frontend typecheck. It also produces .next/standalone, verifying the
      # output the web Dockerfile depends on.
      - name: Build
        run: pnpm build
